name: Ask for a feature
description: Request a new feature or enhancement.
title: "[Feature Request]: "
labels: ["enhancement"]
assignees:
  - guigui0246
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request; please fill in with as much detail as possible.
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-issue checklist
      description: Please make sure you have done all of the following steps first;
      options:
        - label: I have searched the existing issues to make sure this hasn't already been asked.
          required: true
        - label: I have made sure I am on the latest version of the tracker pack.
          required: true
  - type: checkboxes
    id: checklist-2
    attributes:
      label: More Infos
      description: Please select all that apply;
      options:
        - label: I am using the auto-track feature.
          required: false
        - label: I am using a beta release of the tracker pack.
          required: false
  - type: dropdown
    id: ap-version
    attributes:
      label: What version of APWorld are you using?
      description: Please select the version of APWorld you are using.
      options:
        - v0.1.x
        - v0.2.0
        - v0.2.1
        - v0.2.2
        - v0.2.3+
        - Not from https://github.com/randomsalience/albw-archipelago/
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the feature you want?
      description: What would you like to see implemented? If relevant, provide details about how it should work and any use cases.
      placeholder: Tell us what you want!
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: What are your options?
      description: The options your multiworld is running with if you think they are relevant.
    validations:
      required: false
